name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Managed build + tests on every qualified OS (.NET 8 + .NET 10, real asset).
  managed:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: cargo build --locked --manifest-path native/Cargo.toml
      - run: dotnet build BiscuitSharp.slnx
      - run: dotnet run --project tests/BiscuitSharp.Tests --framework net8.0
      - run: dotnet run --project tests/BiscuitSharp.Tests --framework net10.0

  # Bidirectional compatibility gate on every qualified OS (pwsh everywhere).
  compat:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: ./eng/Test-Compat.ps1

  # Native lints (one OS is enough: toolchain-pinned, deterministic).
  native-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml -- -D warnings

  # Release-profile native tests (overflow wraps instead of panicking; the
  # matrix asserts invariants, not exact counts, so profile differences in the
  # distribution are expected and fine).
  native-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: cargo test --locked --release --lib --manifest-path native/Cargo.toml

  # Per-RID release staging + NativeAOT smoke; staging trees upload as artifacts.
  dist:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: ./eng/Test-Dist.ps1 -Rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.rid }}
          path: native/staging/${{ matrix.rid }}
          if-no-files-found: error

  # Assemble the three-RID package, verify it, then clean consumers per OS × TFM.
  pack:
    needs: [dist]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: actions/download-artifact@v4
        with:
          name: staging-win-x64
          path: native/staging/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: staging-linux-x64
          path: native/staging/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: staging-osx-arm64
          path: native/staging/osx-arm64
      - run: ./eng/Verify-NativeStaging.ps1
      - run: dotnet pack src/BiscuitSharp/BiscuitSharp.csproj -p:BiscuitSharpEnablePack=true -o artifacts/packages
      - run: |
          $pkg = Get-ChildItem artifacts/packages/BiscuitSharp.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' } | Select-Object -First 1 -ExpandProperty FullName
          ./eng/Verify-NuGetPackage.ps1 -Package $pkg -Rids win-x64,linux-x64,osx-arm64
          foreach ($rid in @('win-x64', 'linux-x64', 'osx-arm64')) { ./eng/Test-LegalVerification.ps1 -Package $pkg -Rid $rid }
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: |
            artifacts/packages/BiscuitSharp.*.nupkg
            artifacts/packages/BiscuitSharp.*.snupkg
          if-no-files-found: error

  consume:
    needs: [pack]
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        tfm: [net8.0, net10.0]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: artifacts/packages
      - run: |
          $pkg = Get-ChildItem artifacts/packages/BiscuitSharp.*.nupkg | Where-Object { $_.Name -notlike '*.snupkg' } | Select-Object -First 1 -ExpandProperty FullName
          ./eng/Test-PackagedConsumer.ps1 -Package $pkg -TargetFramework ${{ matrix.tfm }}

  # Native-memory instrumentation (Linux): leak-probe cycles under Valgrind.
  # Memory errors and definite/possible leaks fail; display every allocation kind.
  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: |
          cargo build --locked --example leak_probe --manifest-path native/Cargo.toml
          bin=native/target/debug/examples/leak_probe
          test -x "$bin" || { echo "leak-probe executable not found"; exit 1; }
          # --errors-for-leaks was removed in newer Valgrind; probe for it and
          # always assert the leak summary directly (version-independent).
          leak_opt=""
          if valgrind --help 2>&1 | grep -q -- "--errors-for-leaks"; then leak_opt="--errors-for-leaks=yes"; fi
          log=$(mktemp)
          set +e
          valgrind --leak-check=full --show-leak-kinds=all $leak_opt --error-exitcode=99 -s "$bin" > "$log" 2>&1
          code=$?
          set -e
          cat "$log"
          test $code -eq 0 || { echo "valgrind reported errors (exit $code)"; exit 1; }
          grep -q '^LEAK_PROBE_WORKLOAD_STARTED cycles=50$' "$log" || { echo "leak workload start marker missing"; exit 1; }
          grep -q '^LEAK_PROBE_WORKLOAD_COMPLETED cycles=50$' "$log" || { echo "leak workload completion marker missing"; exit 1; }
          grep -q '^LEAK_PROBE_PASSED cycles=50$' "$log" || { echo "leak probe did not finish successfully"; exit 1; }
          grep -q "definitely lost: 0 bytes in 0 blocks" "$log" || { echo "no zero-leak summary found"; exit 1; }
          rm -f "$log"
