name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  managed:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo build --locked --manifest-path native/Cargo.toml
      - run: dotnet build BiscuitSharp.slnx
      - run: dotnet run --project tests/BiscuitSharp.Tests --framework net8.0
      - run: dotnet run --project tests/BiscuitSharp.Tests --framework net10.0
  compat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File eng/Test-Compat.ps1
  native-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path native/Cargo.toml -- -D warnings
  # M2 add: native builds + tests per RID (linux-x64, osx-arm64), mutation/fuzz,
  # Valgrind, NativeAOT per RID, package verification, and six clean consumers.
  # See docs/implementation-plan.md.
