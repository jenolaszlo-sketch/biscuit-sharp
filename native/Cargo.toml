[package]
name = "biscuitsharp_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned per BiscuitSharp M0 baseline. Do not float. Cargo.lock is committed.
biscuit-auth = { version = "=6.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
